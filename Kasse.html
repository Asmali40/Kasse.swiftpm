<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veranstaltungskasse</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2ef;color:#17352d;font:17px system-ui}header{background:#173f35;color:white;padding:20px 28px;display:flex;justify-content:space-between;align-items:center}main{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;padding:24px;max-width:1500px;margin:auto}button,select{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px;min-height:48px}button{background:#dce9e1;color:#17352d}button:disabled{opacity:.45;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.product{background:white;text-align:left;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid #d7e2db}.product strong{font-size:22px}.panel{background:white;border-radius:20px;padding:24px}.row{display:flex;align-items:center;gap:8px;border-bottom:1px solid #ddd;padding:12px 0}.row span:first-child{flex:1}.total{font-size:38px;font-weight:800;margin:20px 0}.primary{background:#176449;color:white;width:100%;font-weight:bold}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.active{background:#173f35;color:white}small{opacity:.8}#receipt{display:none}@media(max-width:700px){main{grid-template-columns:1fr;padding:12px}header{padding:14px}}@media print{header,main{display:none}#receipt{display:block;color:black;background:white;font:13pt monospace;white-space:pre-wrap;text-align:center;width:48mm}body{background:white}@page{margin:2mm}}
</style><header><div><strong>VERANSTALTUNGSKASSE</strong><br><small>Ditib Wörth · Hamsi Festivali</small></div><div><span id="number"></span> <button id="stats">Intern · Statistik</button></div></header><main><section><h1>Produkte auswählen</h1><div class="tabs" id="tabs"></div><div class="grid" id="products"></div></section><section class="panel"><h2>Bestellung</h2><div id="cart"></div><div class="total" id="total"></div><button class="primary" id="pay">Bezahlt & drucken</button><p id="status" role="status"></p><button id="next" hidden>Neue Bestellung</button> <button id="clear">Warenkorb leeren</button></section></main><dialog id="statsDialog"><h2>Interne Verkaufsstatistik</h2><p id="statsText"></p><button id="closeStats">Schließen</button></dialog><pre id="receipt"></pre><script>
const products=[["Hamsi", 800, "Speisen"], ["Ekmek Arası Uskumru", 600, "Speisen"], ["Patates Kızartması", 200, "Speisen"], ["Baklava (2 adet)", 100, "Desserts"], ["Şekerpare (2 adet)", 100, "Desserts"], ["Revani (1 adet)", 100, "Desserts"]];const $=id=>document.getElementById(id), money=n=>(n/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});let cart={},cat='Alle',paid=false,sending=false,number=1;let ledger={count:0,cents:0,next:1,last:null};try{ledger=JSON.parse(localStorage.getItem('hamsiLedger')||'null')||ledger}catch{};number=ledger.next;if(ledger.last){cart=ledger.last.cart;paid=true;number=ledger.last.number;$('receipt').textContent=ledger.last.receipt} $('stats').onclick=()=>{$('statsText').textContent='Bezahlte Bestellungen: '+ledger.count+' · Umsatz: '+money(ledger.cents);$('statsDialog').showModal()};$('closeStats').onclick=()=>$('statsDialog').close();function save(v){localStorage.setItem('hamsiLedger',JSON.stringify(v));ledger=v} function render(){ $('number').textContent='Bon #'+number; $('tabs').replaceChildren(); for(const c of ['Alle','Speisen','Desserts']){let b=document.createElement('button');b.textContent=c;b.className=c===cat?'active':'';b.onclick=()=>{cat=c;render()};$('tabs').append(b)} $('products').replaceChildren();products.forEach((p,i)=>{if(cat!=='Alle'&&cat!==p[2])return;let b=document.createElement('button');b.className='product';b.disabled=paid||sending;b.innerHTML='<strong>'+p[0]+'</strong><span>'+money(p[1])+'</span>';b.onclick=()=>{cart[i]=(cart[i]||0)+1;render()};$('products').append(b)});$('cart').replaceChildren();let sum=0;for(const [i,q] of Object.entries(cart)){let p=products[i];sum+=p[1]*q;let r=document.createElement('div');r.className='row';let s=document.createElement('span');s.textContent=q+' × '+p[0]+' · '+money(q*p[1]);r.append(s);for(const d of [-1,1]){let b=document.createElement('button');b.textContent=d===1?'+':'−';b.disabled=paid||sending;b.onclick=()=>{cart[i]+=d;if(!cart[i])delete cart[i];render()};r.append(b)}$('cart').append(r)}if(!sum)$('cart').textContent='Noch keine Produkte ausgewählt.';$('total').textContent=money(sum);$('pay').disabled=!sum||sending;$('pay').textContent=paid?'Bon erneut drucken':'Bezahlt & drucken';$('next').hidden=!paid;$('next').disabled=sending;$('clear').disabled=paid;return sum} $('clear').onclick=()=>{cart={};render()};$('pay').onclick=async()=>{if(sending)return;let sum=render();if(!sum)return;if(!paid){const receipt=['Ditib Wörth','Hamsi Festivali','------------------------',...Object.entries(cart).map(([i,q])=>q+' x '+products[i][0]),'------------------------','Toplam: '+money(sum),'Bahnhofstraße 40','76744 Wörth am Rhein'].join('\n');try{save({...ledger,count:ledger.count+1,cents:ledger.cents+sum,next:number+1,last:{cart,number,receipt}})}catch(e){$('status').textContent='Speichern fehlgeschlagen – Verkauf nicht erfasst.';return}paid=true;$('receipt').textContent=receipt}render();sending=true;render();$('status').textContent='Druckauftrag wird gesendet …';try{await window.webkit.messageHandlers.printBon.postMessage($('receipt').textContent);$('status').textContent='Druck abgeschlossen. Bon prüfen.'}catch(e){$('status').textContent='Druckfehler: '+e.message+' — Bon prüfen und ggf. erneut drucken.'}finally{sending=false;render()}};$('next').onclick=()=>{try{save({...ledger,last:null})}catch(e){$('status').textContent='Speichern fehlgeschlagen.';return}number=ledger.next;cart={};paid=false;$('status').textContent='';render()};render();</script></html>
